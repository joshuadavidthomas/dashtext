name: build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - .github/actions/**
      - crates/**
      - resources/**
      - Cargo.toml
      - Cargo.lock
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version tag for release packaging
        required: false
        type: string
      sign:
        description: Enable signing (requires release env & secrets)
        required: false
        type: boolean
        default: false
    secrets:
      MINISIGN_SECRET_KEY:
        description: Minisign secret key for signing update tarballs
        required: false
      MINISIGN_PASSWORD:
        description: Password for the minisign secret key
        required: false
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    # Only signed builds use the 'release' environment (and its secrets)
    environment: ${{ inputs.sign && 'release' || '' }}
    env:
      VERSION: ${{ inputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-linux-dependencies

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v1
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build
        run: cargo build --release --locked -p dashtext

      - name: Create tarball
        run: |
          dist="dashtext-${VERSION}-linux-x86_64"
          mkdir -p "dist/${dist}"
          cp target/release/dashtext README.md LICENSE "dist/${dist}/"
          cp resources/linux/app.dashtext.Dashtext.desktop "dist/${dist}/"
          tar -C dist -czf "dist/${dist}.tar.gz" "${dist}"

      - name: Install minisign
        if: ${{ inputs.sign }}
        run: |
          MINISIGN_VERSION=$(curl -s https://api.github.com/repos/jedisct1/minisign/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz" | tar xz
          sudo mv minisign-linux/x86_64/minisign /usr/local/bin/

      - name: Sign tarball with minisign
        if: ${{ inputs.sign }}
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          echo "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          for f in *.tar.gz; do
            echo "$MINISIGN_PASSWORD" | minisign -Sm "$f" -s /tmp/minisign.key -t "dashtext release" -W
          done
          rm /tmp/minisign.key

      - name: Generate checksums
        working-directory: dist
        run: for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-tar
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.minisig
            dist/*.sha256
