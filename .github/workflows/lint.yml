name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-devenv

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek/
          key: prek-1|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        shell: devenv shell -- bash -e {0}
        run: |
          SKIP=cargo-fmt,cargo-clippy \
          prek run --all-files --show-diff-on-failure --color always

  fmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-devenv

      - name: Run rustfmt
        working-directory: tools/rustfmt
        shell: devenv shell -- bash -e {0}
        run: cargo fmt --manifest-path "${{ github.workspace }}/Cargo.toml" --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-devenv

      - name: Run clippy
        shell: devenv shell -- bash -e {0}
        run: cargo clippy --manifest-path Cargo.toml --workspace --locked --all-targets --all-features -- -D warnings

  hawk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-devenv

      - name: Run hawk
        working-directory: tools/hawk
        shell: devenv shell -- bash -e {0}
        run: cargo hawk check --manifest-path "${{ github.workspace }}/Cargo.toml" --target-dir "${{ github.workspace }}/target/hawk" -D warnings

  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-devenv

      - name: Run cargo check
        shell: devenv shell -- bash -e {0}
        run: cargo check --manifest-path Cargo.toml --workspace --locked --all-targets --all-features

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-devenv

      - name: Run tests
        shell: devenv shell -- bash -e {0}
        run: cargo test --manifest-path Cargo.toml --workspace --locked --all-features
