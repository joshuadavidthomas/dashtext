name: Install Linux dependencies
description: Install the native libraries and build tools required by Dashtext

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          clang \
          cmake \
          glslc \
          libasound2-dev \
          libayatana-appindicator3-dev \
          libfontconfig-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libvulkan-dev \
          libvulkan1 \
          libwayland-dev \
          libwebkit2gtk-4.1-dev \
          libx11-xcb-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          patchelf \
          pkg-config
